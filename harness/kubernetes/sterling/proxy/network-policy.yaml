apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: balls-bench-proxy
  labels:
    app.kubernetes.io/name: balls-bench-proxy
    app.kubernetes.io/part-of: balls-bench
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: balls-bench-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: balls-bench-agent
      ports:
        - protocol: TCP
          port: 3128
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
