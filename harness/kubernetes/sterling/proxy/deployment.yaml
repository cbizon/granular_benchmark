apiVersion: apps/v1
kind: Deployment
metadata:
  name: balls-bench-proxy
  labels:
    app.kubernetes.io/name: balls-bench-proxy
    app.kubernetes.io/part-of: balls-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: balls-bench-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balls-bench-proxy
        app.kubernetes.io/part-of: balls-bench
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: ubuntu/squid:latest
          imagePullPolicy: Always
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: log
              mountPath: /var/log/squid
            - name: run
              mountPath: /run
            - name: spool
              mountPath: /var/spool/squid
      volumes:
        - name: config
          configMap:
            name: balls-bench-proxy
        - name: log
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: spool
          emptyDir: {}
